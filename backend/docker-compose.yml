version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: cropdect_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cropdect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: cropdect_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    container_name: cropdect_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
