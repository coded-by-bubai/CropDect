name: cropdect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  shared_preferences_windows: ^2.4.1
  camera: ^0.12.0+2
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  permission_handler: ^11.3.1
  translator: ^1.0.4+1
  flutter_tts: ^4.2.5
  flutter_markdown: ^0.7.7+1
  google_mlkit_image_labeling: ^0.15.0
  flutter_image_compress: ^2.5.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  tflite_flutter: ^0.12.1
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.jpg
    - assets/ml/cropdect_model.tflite
    - assets/ml/labels.txt

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#046938"
  adaptive_icon_foreground: "assets/app_logo.jpg"
  web:
    generate: true
    image_path: "assets/app_logo.jpg"
    background_color: "#046938"
    theme_color: "#046938"
